<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>GeoAir-Pulse | Hyper-Local PM2.5 & Urban Heat Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="lib/mapbox-gl.css" rel="stylesheet" />
<script src="lib/mapbox-gl.js"></script>
<script src="lib/deck.gl.min.js"></script>

<style>
  :root {
    --bg: #090d12;
    --panel: #111722;
    --panel-border: #1e293b;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent: #38bdf8;
    --accent-hover: #0284c7;
    --card-bg: #0f172a;
  }
  
  * { box-sizing: border-box; }
  
  html, body, #map { 
    height: 100%; 
    margin: 0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
    background: var(--bg); 
    color: var(--text-primary); 
    overflow: hidden;
  }

  #app { position: relative; height: 100vh; width: 100vw; }

  .panel {
    position: absolute;
    background: rgba(17, 23, 34, 0.88);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 16px 18px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    z-index: 10;
  }

  #controls { top: 20px; left: 20px; width: 300px; }
  
  .brand-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 2px;
  }
  
  #controls h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  #controls .subtitle { font-size: 11px; color: var(--text-secondary); margin-bottom: 14px; font-weight: 400; }

  .form-group { margin-bottom: 12px; }
  label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 5px; }
  
  select, input[type="date"] {
    width: 100%; 
    padding: 8px 10px; 
    border-radius: 8px; 
    border: 1px solid var(--panel-border);
    background: var(--card-bg); 
    color: var(--text-primary); 
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  select:focus, input[type="date"]:focus {
    border-color: var(--accent);
  }

  #legend { bottom: 24px; left: 20px; width: 230px; }
  #legend h2 { font-size: 11px; font-weight: 600; margin: 0 0 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .05em; }
  .legend-row { display: flex; align-items: center; gap: 10px; font-size: 12px; margin-bottom: 6px; color: var(--text-primary); }
  .swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }

  #status { 
    top: 20px; 
    right: 20px; 
    padding: 8px 14px;
    font-size: 12px; 
    font-weight: 500;
    color: var(--text-primary); 
    display: flex;
    align-items: center;
  }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
  .dot-ok { background: #22c55e; box-shadow: 0 0 8px #22c55e80; }
  .dot-err { background: #ef4444; box-shadow: 0 0 8px #ef444480; }

  #tooltip {
    position: absolute; 
    pointer-events: none; 
    z-index: 20;
    background: rgba(15, 23, 42, 0.95); 
    border: 1px solid var(--panel-border); 
    border-radius: 8px;
    padding: 10px 12px; 
    font-size: 12px; 
    display: none; 
    line-height: 1.6;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
  }
  #tooltip b { color: var(--accent); }

  .toggle-btn {
    margin-top: 6px; 
    width: 100%; 
    padding: 9px; 
    border-radius: 8px; 
    border: none;
    background: var(--accent); 
    color: #000; 
    font-size: 12px; 
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .toggle-btn:hover { background: #7dd3fc; }
  .toggle-btn:active { transform: scale(0.98); }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div class="panel" id="controls">
    <div class="brand-header">
      <span style="font-size: 18px;">🌫️</span>
      <h1>GeoAir-Pulse</h1>
    </div>
    <div class="subtitle">100m-resolution PM2.5 & Heat Analytics</div>

    <div class="form-group">
      <label for="cityInput">Target City</label>
      <select id="cityInput">
        <option value="Delhi">Delhi</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Bengaluru">Bengaluru</option>
      </select>
    </div>

    <div class="form-group">
      <label for="dateInput">Observation Date</label>
      <input type="date" id="dateInput" />
    </div>

    <div class="form-group">
      <label for="metricInput">2.5D Extrusion Metric</label>
      <select id="metricInput">
        <option value="pm25_pred">PM2.5 Concentration (µg/m³)</option>
        <option value="lst_celsius">Land Surface Temp (°C)</option>
      </select>
    </div>

    <button class="toggle-btn" id="refreshBtn">Update Visualization</button>
  </div>

  <div class="panel" id="legend">
    <h2 id="legendTitle">PM2.5 (µg/m³)</h2>
    <div id="legendRows"></div>
  </div>

  <div class="panel" id="status">
    <span class="dot dot-ok" id="statusDot"></span><span id="statusText">Initializing dashboard…</span>
  </div>

  <div id="tooltip"></div>
</div>

<script>
/* =====================================================================
   GeoAir-Pulse :: WebGIS Dashboard
   Deck.gl GridLayer/ColumnLayer for 2.5D extrusion over Mapbox GL base.
   ===================================================================== */

const API_BASE = "http://localhost:8050/api/v1";
const MAPBOX_TOKEN = "pk.eyJ1IjoicHJha2FzaDg5MTkyIiwiYSI6ImNtc25oMXplcjAzczEyeXNkODdwNDZvOTAifQ.mdAmtVL7lOiSTW6F97-DDA";

mapboxgl.accessToken = MAPBOX_TOKEN;

const CITY_CENTERS = {
  Delhi: [77.1025, 28.7041],
  Mumbai: [72.8777, 19.0760],
  Bengaluru: [77.5946, 12.9716],
};

const PM25_COLOR_STOPS = [
  { max: 12,    color: [34, 197, 94, 210],  label: "0–12 Good" },
  { max: 35.4,  color: [234, 179, 8, 210],  label: "12–35 Moderate" },
  { max: 55.4,  color: [249, 115, 22, 210], label: "35–55 Unhealthy (SG)" },
  { max: 150.4, color: [239, 68, 68, 210],  label: "55–150 Unhealthy" },
  { max: 250.4, color: [147, 51, 234, 210], label: "150–250 Very Unhealthy" },
  { max: Infinity, color: [124, 21, 21, 210], label: "250+ Hazardous" },
];

const LST_COLOR_STOPS = [
  { max: 25, color: [59, 130, 246, 210], label: "< 25°C" },
  { max: 30, color: [56, 189, 248, 210], label: "25–30°C" },
  { max: 35, color: [234, 179, 8, 210],  label: "30–35°C" },
  { max: 40, color: [249, 115, 22, 210], label: "35–40°C" },
  { max: Infinity, color: [239, 68, 68, 210], label: "40°C+" },
];

function colorForValue(value, stops) {
  if (value === null || value === undefined || Number.isNaN(value)) return [100, 100, 100, 120];
  const stop = stops.find(s => value <= s.max);
  return stop ? stop.color : [100, 100, 100, 120];
}

function renderLegend(metric) {
  const stops = metric === "pm25_pred" ? PM25_COLOR_STOPS : LST_COLOR_STOPS;
  document.getElementById("legendTitle").textContent =
    metric === "pm25_pred" ? "PM2.5 (µg/m³)" : "Land Surface Temp (°C)";
    
  const rows = stops.map(s => `
    <div class="legend-row">
      <span class="swatch" style="background: rgba(${s.color.join(",")})"></span>
      <span>${s.label}</span>
    </div>`).join("");
  document.getElementById("legendRows").innerHTML = rows;
}

const map = new mapboxgl.Map({
  container: "map",
  style: "mapbox://styles/mapbox/dark-v11",
  center: CITY_CENTERS.Delhi,
  zoom: 11,
  pitch: 45,
  bearing: -10,
  antialias: true,
});

const deckOverlay = new deck.MapboxOverlay({ layers: [] });
map.addControl(deckOverlay);
map.addControl(new mapboxgl.NavigationControl(), "top-right");

const tooltipEl = document.getElementById("tooltip");

function showTooltip(info) {
  if (!info.object) {
    tooltipEl.style.display = "none";
    return;
  }
  const p = info.object.properties;
  tooltipEl.style.display = "block";
  tooltipEl.style.left = `${info.x + 14}px`;
  tooltipEl.style.top = `${info.y + 14}px`;
  tooltipEl.innerHTML = `
    <div><b>Grid Cell #${p.grid_id ?? "N/A"}</b></div>
    <div>PM2.5: <b>${p.pm25_pred != null ? Number(p.pm25_pred).toFixed(1) : "N/A"} µg/m³</b></div>
    <div>LST: <b>${p.lst_celsius != null ? Number(p.lst_celsius).toFixed(1) : "N/A"} °C</b></div>
    <div>AQI Category: <b>${p.aqi_category ?? "N/A"}</b></div>
    <div style="color:var(--text-secondary); margin-top:4px; font-size:11px;">${p.predicted_at ? new Date(p.predicted_at).toLocaleString() : ""}</div>
  `;
}

async function fetchGridPredictions(city, date) {
  const params = new URLSearchParams({ city });
  if (date) params.set("date", date);

  let resp = await fetch(`${API_BASE}/grid-predictions?${params.toString()}`);
  if (resp.ok) {
    const data = await resp.json();
    if (data.features && data.features.length > 0) {
      return data;
    }
  }

  // Automatic Fallback: Request latest records without date restriction if query returns 0 rows
  const fallbackParams = new URLSearchParams({ city });
  resp = await fetch(`${API_BASE}/grid-predictions?${fallbackParams.toString()}`);
  if (!resp.ok) {
    throw new Error(`API error ${resp.status}`);
  }
  return resp.json();
}

function buildColumnLayer(featureCollection, metric) {
  const stops = metric === "pm25_pred" ? PM25_COLOR_STOPS : LST_COLOR_STOPS;

  return new deck.GeoJsonLayer({
    id: "grid-predictions-layer",
    data: featureCollection,
    extruded: true,
    filled: true,
    stroked: false,
    wireframe: false,
    pickable: true,
    getElevation: f => {
      const v = f.properties[metric];
      return v && v > 0 ? v * 10 : 0; 
    },
    getFillColor: f => colorForValue(f.properties[metric], stops),
    onHover: showTooltip,
    updateTriggers: {
      getElevation: metric,
      getFillColor: metric,
    },
    transitions: {
      getElevation: 400,
      getFillColor: 400,
    },
  });
}

let currentData = null;

async function refresh() {
  const city = document.getElementById("cityInput").value;
  const date = document.getElementById("dateInput").value;
  const metric = document.getElementById("metricInput").value;

  setStatus("loading", "Fetching predictions…");
  try {
    const fc = await fetchGridPredictions(city, date);
    currentData = fc;

    if (!fc.features || !fc.features.length) {
      setStatus("err", "No grid predictions found.");
      deckOverlay.setProps({ layers: [] });
      return;
    }

    deckOverlay.setProps({ layers: [buildColumnLayer(fc, metric)] });
    renderLegend(metric);

    const center = CITY_CENTERS[city] || CITY_CENTERS.Delhi;
    map.flyTo({ center, zoom: 11.5, duration: 800 });

    setStatus("ok", `Loaded ${fc.features.length} cells (${city})`);
  } catch (err) {
    console.error(err);
    setStatus("err", `Failed to load data`);
  }
}

function setStatus(kind, text) {
  const dot = document.getElementById("statusDot");
  dot.className = `dot ${kind === "ok" ? "dot-ok" : kind === "loading" ? "dot-ok" : "dot-err"}`;
  document.getElementById("statusText").textContent = text;
}

document.getElementById("refreshBtn").addEventListener("click", refresh);
document.getElementById("metricInput").addEventListener("change", () => {
  if (currentData) {
    const metric = document.getElementById("metricInput").value;
    deckOverlay.setProps({ layers: [buildColumnLayer(currentData, metric)] });
    renderLegend(metric);
  }
});
document.getElementById("cityInput").addEventListener("change", refresh);

// Pre-fill today's date in control panel
document.getElementById("dateInput").value = new Date().toISOString().slice(0, 10);

map.on("load", () => {
  renderLegend("pm25_pred");
  refresh();
});
</script>
</body>
</html>
